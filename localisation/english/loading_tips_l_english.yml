 LOADING_TIP_0: "History does not ask if we are ready. It simply arrives.\n- Alexei Morozov"
 LOADING_TIP_1: "Peace is harder to maintain than war is to begin.\n- Ivan Petrenko"
 LOADING_TIP_2: "A strong state requires strong citizens.\n- Viktor Sokolov"
 LOADING_TIP_3: "Borders on maps can change faster than people's beliefs.\n- Marek Zielinski"
 LOADING_TIP_4: "Technology changes warfare, but not human ambition.\n- Sergei Volkov"
 LOADING_TIP_5: "Every decision made by a leader affects millions.\n- Elena Orlova"
 LOADING_TIP_6: "The economy is another battlefield between nations.\n- Thomas Weber"
 LOADING_TIP_7: "Sometimes silence between nations is the loudest warning.\n- Jan Kowalski"
 LOADING_TIP_8: "The future belongs to those who can adapt.\n- Nikolai Smirnov"
 LOADING_TIP_9: "History remembers victories, but also remembers sacrifices.\n- Anna Petrova"
 LOADING_TIP_10: "Ideologies can divide people more than borders.\n- Karl Steiner"
 LOADING_TIP_11: "Nations rise and fall, but people remain.\n- Piotr Nowak"
 LOADING_TIP_12: "An army can win a battle, but not always the future.\n- Yuri Antonov"
 LOADING_TIP_13: "The greatest conflicts often begin with the smallest decisions.\n- Maria Ivanova"
 LOADING_TIP_14: "Information has become the new weapon of the world.\n- Hans Richter"
 LOADING_TIP_15: "Every generation must solve its own crises.\n- Andrei Kuznetsov"
 LOADING_TIP_16: "Diplomacy is the art of winning without fighting.\n- Leonid Baranov"
 LOADING_TIP_17: "States have interests, people have dreams.\n- Adam Wojcik"
 LOADING_TIP_18: "A year of change can begin an era of transformation.\n- Sergei Belov"
 LOADING_TIP_19: "Fear can control people, but it cannot create loyalty.\n- Elena Morozova"
 LOADING_TIP_20: "The world stands on the edge, and every step matters.\n- Viktor Orlov"
 LOADING_TIP_21: "The future is not written. It is created.\n- Marek Lis"
 LOADING_TIP_22: "Crises reveal the true strength of nations.\n- Anatoly Romanov"
 LOADING_TIP_23: "Power without responsibility leads to disaster.\n- Katarzyna Nowak"
 LOADING_TIP_24: "A new decade brings new challenges.\n- Pavel Volkov"
 LOADING_TIP_25: "No ideology can stop the passage of time.\n- Robert Klein"
 LOADING_TIP_26: "Since the Italian-Greek war, one does not say \"the Greeks are fighting like heroes\", but \"the heroes are fighting like Greeks\".\n- The Montreal Daily Star, 1942"
 LOADING_TIP_27: "History does not ask if we are ready. It simply arrives.\n- Alexei Morozov"
 LOADING_TIP_28: "Freedom is never given. It is defended by those who refuse to surrender. \n- Polish Resistance leader"
 LOADING_TIP_29: "Wars are never truly over. They wait for the next generation to begin again. \n- a man in Moskva"
 LOADING_TIP_30: "History does not repeat itself. It waits for humanity to make the same mistakes. \n- USA leader in UN after world war three"