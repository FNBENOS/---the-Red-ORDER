l_english:
 RED_ORDER_BOOKMARK_LOC:0  "the Red Order is alternative history of cold war where the soviet union won"
 UKB_ROB_DESC_LOC:0  "Britain after World War III is in bad shape. Despite successfully defending its islands, a large part of the population has switched sides and wants to join the World Pact. The country is on the brink of civil war between the Crown and the Commune. Will you be able to change Britain and the world?"
 SOV_ROB_DESC_LOC:0  "The USSR is doing well after winning World War III. Nearly all of Europe is under the USSR’s boot, but the country is becoming weaker and weaker. Puppet states in the West are starting to rebel, while the Soviet Republics demand greater freedom — even independence! Stability is decreasing, corruption is rising, and the economy is collapsing... Will you manage to save the country and win the Cold War?"